[workspace]
members = [
    "crates/rotero-models",
    "crates/rotero-pdf",
    "crates/rotero-search",
    "crates/rotero-bib",
    "crates/rotero-connector",
    "crates/rotero-graph",
    "crates/rotero-db",
    "crates/rotero-mcp",
    "crates/rotero-translate",
]
resolver = "3"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# One pin for the database driver: two crates drifting apart put two copies of
# turso in the tree, and its types stop being interchangeable across the crate
# boundary.
turso = "0.7.2"
serde = { version = "1", features = ["derive", "rc"] }
# Snapshot compression and integrity, shared by the sync engine and the Node.js
# download that predates it.
flate2 = "1"
sha2 = "0.10"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
futures-util = "0.3"

# Internal crates
rotero-models = { path = "crates/rotero-models" }
rotero-pdf = { path = "crates/rotero-pdf" }
rotero-bib = { path = "crates/rotero-bib" }
rotero-search = { path = "crates/rotero-search" }
rotero-connector = { path = "crates/rotero-connector" }
rotero-graph = { path = "crates/rotero-graph" }
rotero-db = { path = "crates/rotero-db" }
rotero-mcp = { path = "crates/rotero-mcp" }
rotero-translate = { path = "crates/rotero-translate" }

[package]
name = "rotero"
version.workspace = true
edition.workspace = true

[dependencies]
rotero-models.workspace = true
rotero-pdf.workspace = true
rotero-bib.workspace = true
rotero-search.workspace = true
rotero-connector = { workspace = true, optional = true }
rotero-translate = { workspace = true, optional = true }
rotero-graph.workspace = true
rotero-db.workspace = true
rotero-mcp.workspace = true
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }

dioxus = "0.7"
rfd = { version = "0.17", optional = true }
# `blocking` backs the Node.js download, which runs on the agent's own
# std::thread rather than the tokio runtime.
# `stream` backs the size-capped PDF download, which bounds the body as it
# arrives rather than buffering an unbounded response first.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
directories = { version = "6", optional = true }
base64 = "0.23"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
apple-utils = { version = "0.1", optional = true }
regex = "1"
urlencoding = "2"
which = "8.0.2"
pulldown-cmark = "0.13.3"
pulldown-latex = "0.8"
futures-util.workspace = true
axum = "0.8"
arboard = "3"
open = "5"
tempfile = { workspace = true, optional = true }
# Spawns children into a process group (Unix) or job object (Windows) so the
# whole tree can be killed together.
process-wrap = { version = "9", features = ["std"] }
# Node.js archive extraction: .tar.gz on Unix, .zip on Windows.
flate2.workspace = true
tar = "0.4"
# Verifies the Node.js download against nodejs.org's published SHASUMS256.
sha2.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
self-replace = "1"

# Signal-based child reaping is Unix-only; Windows uses job objects instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2.184"

[target.'cfg(windows)'.dependencies]
# Only for CREATE_NO_WINDOW. Must track the version process-wrap links against,
# or the creation-flag type is a different, incompatible type.
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-cloud-kit = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

[dev-dependencies]
# `test-util` provides the paused clock the import-queue tests use, so they
# assert scheduling order without sleeping in real time.
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:rfd", "dep:rotero-connector", "dep:rotero-translate", "dep:directories", "dep:tempfile"]
mobile = ["dioxus/mobile", "dep:apple-utils"]
cloudkit = ["dep:objc2", "dep:objc2-cloud-kit", "dep:objc2-foundation", "dep:block2"]
pdfium-static = ["rotero-pdf/static"]
# Opt-in: run the upstream `translators/*.js` corpus in-process (boa engine) and
# proxy gated publishers' follow-up fetches through the browser. Requires
# desktop. Off by default — the app then uses only the Rust hub translators.
translator-engine = [
    "desktop",
    "rotero-connector/translator-engine",
    "rotero-translate/translator-engine",
]
