[package]
name = "rotero-typeset"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
typst = "=0.15.0"
typst-layout = "=0.15.0"
typst-pdf = "=0.15.0"
typst-kit = { version = "=0.15.0", default-features = false, features = [
    "embedded-fonts",
    "system-files",
    "system-packages",
    "universe-packages",
    "system-downloader",
    "datetime",
] }
ureq = { version = "2", features = ["json"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
