[package]
name = "rotero-translate"
version.workspace = true
edition.workspace = true

[dependencies]
rotero-models.workspace = true
rotero-search.workspace = true
rotero-bib.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
scraper = "0.22"
async-trait = "0.1"

# The JS translator engine (phase 2). Off by default so lean builds stay small
# and fast; the desktop app opts in. Runs upstream Zotero translators unmodified.
# Pinned to a boa `main` revision (post-0.21.1) for the fix to boa-dev/boa#4485:
# 0.21.1's VM leaked the caller's last-evaluated expression as a no-`return`
# function's result, so a constructor after an `Obj.member = function(){}`
# assignment returned the stale function instead of a new instance. That broke
# the singleton idiom (`var X = new function(){}`) large import translators
# (RIS/BibTeX/MODS) use. Revert to a crates.io release once >0.21.1 ships the fix.
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "8a1e8fe07f626f7a067afc2c9885d5d87de4bb5d", optional = true }
skyscraper = { version = "0.7", optional = true }
# CSS node handles for the engine's querySelector layer. ego-tree is already
# built transitively via scraper; naming it lets the DOM adapter hold NodeIds.
ego-tree = { version = "0.10", optional = true }
# JsTranslator matches a page against the translator's `target` URL regex.
regex = { version = "1", optional = true }

[features]
default = []
# The engine's HTTP host functions (ZU.doGet/processDocuments) run synchronously
# on a spawn_blocking thread, so they need reqwest's blocking client.
translator-engine = [
    "dep:boa_engine",
    "dep:skyscraper",
    "dep:ego-tree",
    "dep:regex",
    "reqwest/blocking",
]
