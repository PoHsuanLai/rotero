        <meta name="citation_abstract"  content="Heir to the racist configuration of the American art exchange and the delimiting appraisals of blackness in the American mainstream media, Jean-Michel Basquiat appeared on the late 1970s New York City street art scene – then he called himself “SAMO.” Not long thereafter, Basquiat grew into one of the most influential artists of an international movement that began around 1980, marked by a return to figurative painting. Given its rough, seemingly untrained and extreme, conceptual nature, Basquiat&#39;s high-art oeuvre might not look so sophisticated to the uninformed viewer. However, Basquiat&#39;s work reveals a powerful poetic and visual gift, “heady enough to confound academics and hip enough to capture the attention span of the hip hop nation,” as Greg Tate has remarked. As noted by Richard Marshall, Basquiat&#39;s aesthetic strength actually comes from his striving “to achieve a balance between the visual and intellectual attributes” of his artwork. Like Marshall, Tate, and others, I will connect with Basquiat&#39;s unique, self-reflexively experimental visual practices of signifying and examine anew Basquiat&#39;s active contribution to his self-alienation, as Hebdige has called it. Basquiat&#39;s aesthetic makes of his paintings economies of accumulation, building a productive play of contingency from the mainstream&#39;s constructions of race. This aesthetic move speaks to a need for escape from the perceived epistemic necessities of blackness. Through these economies of accumulation we see, as Tate has pointed out, Basquiat&#39;s “intellectual obsession” with issues such as ancestry/modernity, personhood/property and originality/origins of knowledge, driven by his tireless need to problematize mainstream media&#39;s discourses surrounding race – in other words, a commodified American Africanism.">

        AOP.loadScript(AOP.baseUrl + '/cambridge-core/public/js/a11y-1.0.40.min.js', function () {
          if(!window.cambridgeA11y) {
            console.error('cambridgeA11y not loaded')
            return
          }
          const { ShareaholicAccessibilityHandler, FocusTrapKeydownHandler } = window.cambridgeA11y

  <script type="text/javascript">
      var AOP = AOP || {};
      AOP.focusTrap = function (modalId, firstFocusableElement) {
        var modalElement = document.getElementById(modalId)
        modalElement.removeAttribute('tabindex')
  
        if (!modalElement) {
          return;
        }
  
        // Get all focusable elements inside the modal
        var focusableElements = Array.from(modalElement.querySelectorAll(
          'a[href], area[href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex="0"]'
        ))
  
        focusableElements = focusableElements.filter(el => {
          const ancestorElement = el.offsetParent || el.parentElement
          const visibleElement = el.style.visibility !== 'hidden'
  
          return ancestorElement && visibleElement
        })
  
        if (!focusableElements) {
          return;
        }
  
        var firstFocusable = firstFocusableElement || focusableElements[0]
        var lastFocusable = focusableElements[focusableElements.length - 1]
        var TAB_KEY_CODE = 'Tab'
  
        firstFocusable.focus()
  
        $(firstFocusable).on('keydown', function (event) {
          var isTabPressed = event.key === TAB_KEY_CODE
  
          if (!isTabPressed) {
            return
          }
          if (event.shiftKey) {
            event.preventDefault()
            lastFocusable.focus()
          }
        })
  
        $(`#${modalId}`).on('keydown', function (event) {
          var isTabPressed = event.key === TAB_KEY_CODE
  
          if (!isTabPressed) {
            return
          }
          if (event.shiftKey) {
            if (document.activeElement === firstFocusable || document.activeElement === modalElement) {
              event.preventDefault()
              lastFocusable.focus()
            }
          } else {
            if (document.activeElement === lastFocusable || document.activeElement === modalElement) {
              event.preventDefault()
              firstFocusable.focus()
            }
          }
        })
      }
    </script>
    <script>
      $(document).ready(function () {
				// remove all `click` for `consent-link`, then delegate the event to that class only
        $(document).off('click', '.consent-link').on('click', '.consent-link', function (e) {
          e.preventDefault();

          if (window?.OneTrust?.ToggleInfoDisplay) {
            window.OneTrust.ToggleInfoDisplay();
          }
        })

        setTimeout(function () {
          var ua = navigator.userAgent;

          var isFirefox = ua.toLowerCase().includes('firefox');
          var isSafari = /^((?!chrome|android).)*safari/i.test(ua);

          if (isFirefox || isSafari) {
            $('.ot-tgl input').next('span').remove();
          }
        }, 2000); // 2 seconds delay
      });
    </script>
