<meta name="dc.description" content="A nanoscale thermometry technique that uses coherent manipulation of the electronic spin associated with nitrogen&#8211;vacancy colour centres in diamond makes it possible to detect temperature variations as small as 1.8&#8201;millikelvin in ultrapure samples and to control and map temperature gradients within living cells. A nanoscale thermometer capable of subdegree temperature resolution and of integration within living cells could provide a powerful new tool for many areas of biological and medical research. This paper describes a new probe for nanoscale thermometry that achieves just that. The device uses quantum manipulation of nitrogen&#8211;vacancy colour centres in diamond nanocrystals. These harbour single electron spins and have specific fluorescence properties that are sensitively dependent on the local temperature. The authors show that they can be accurately measured with a spatial resolution down to 200 nm. By introducing both nanodiamonds and gold nanoparticles into a single human embryonic fibroblast, they demonstrate temperature-gradient control and mapping at the subcellular level. Sensitive probing of temperature variations on nanometre scales is an outstanding challenge in many areas of modern science and technology1. In particular, a thermometer capable of subdegree temperature resolution over a large range of temperatures as well as integration within a living system could provide a powerful new tool in many areas of biological, physical and chemical research. Possibilities range from the temperature-induced control of gene expression2,3,4,5 and tumour metabolism6 to the cell-selective treatment of disease7,8 and the study of heat dissipation in integrated circuits1. By combining local light-induced heat sources with sensitive nanoscale thermometry, it may also be possible to engineer biological processes at the subcellular level2,3,4,5. Here we demonstrate a new approach to nanoscale thermometry that uses coherent manipulation of the electronic spin associated with nitrogen&#8211;vacancy colour centres in diamond. Our technique makes it possible to detect temperature variations as small as 1.8&#8201;mK (a sensitivity of 9&#8201;mK&#8201;Hz&#8722;1/2) in an ultrapure bulk diamond sample. Using nitrogen&#8211;vacancy centres in diamond nanocrystals (nanodiamonds), we directly measure the local thermal environment on length scales as short as 200&#8201;nanometres. Finally, by introducing both nanodiamonds and gold nanoparticles into a single human embryonic fibroblast, we demonstrate temperature-gradient control and mapping at the subcellular level, enabling unique potential applications in life sciences."/>
