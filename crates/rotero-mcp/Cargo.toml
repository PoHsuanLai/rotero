[package]
name = "rotero-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rotero-mcp"
path = "src/main.rs"

[lib]
name = "rotero_mcp"
path = "src/lib.rs"

[dependencies]
rotero-models.workspace = true
rotero-pdf.workspace = true
rotero-graph.workspace = true
rotero-db.workspace = true
rotero-search.workspace = true

rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
turso.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
schemars = "1"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
