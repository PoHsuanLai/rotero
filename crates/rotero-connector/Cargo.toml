[package]
name = "rotero-connector"
version.workspace = true
edition.workspace = true

[dependencies]
rotero-models.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
scraper = "0.27"
rotero-translate = { path = "../rotero-translate" }
rotero-bib = { path = "../rotero-bib" }

[features]
default = []
# Enable the in-process JS translator engine (the upstream `translators/*.js`
# corpus) and, with it, the browser-proxied follow-up-fetch path for gated
# publishers. Off by default: the connector then runs only the Rust hub
# translators, exactly as before.
translator-engine = ["rotero-translate/translator-engine"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json.workspace = true
