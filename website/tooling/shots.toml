# Screenshots embedded in the user guide.
#
# Each shot names an output file and the steps that put the app into the state
# it captures. Steps run in order against the app's WebView, then the whole
# window is captured. Before each shot the harness resets to the library root,
# so shots do not depend on each other.
#
# Step forms:
#   click    = "<css selector>"          click the first match
#   type     = "<css selector>|<text>"   focus and type into a field
#   eval     = "<javascript>"            for state a plain click cannot reach
#   wait     = <milliseconds>            let rendering settle
#
# Most toolbar controls are `button.btn` distinguished only by their label, so
# steps find them by text rather than by class. `byText` is injected by the
# capture script.

[[shot]]
id = "library-overview"
file = "library-overview.png"
description = "The library list with the sidebar, paper rows, and detail panel"
steps = [
  { eval = "realClick(document.querySelectorAll('.library-card')[2])" },
  { wait = 700 },
]

[[shot]]
id = "sidebar-collections"
file = "sidebar-collections.png"
description = "Nested collections and colored tags in the sidebar"
steps = [
  { eval = "byText('.sidebar-nav-item', 'Favorites')?.click()" },
  { wait = 700 },
]

[[shot]]
id = "search-unified"
file = "search-unified.png"
description = "Unified search showing library hits above web results"
steps = [
  { type = "#library-search-input|deoptimization" },
  { wait = 4000 },
]

[[shot]]
id = "pdf-reader"
file = "pdf-reader.png"
description = "The PDF reader with a page open and the tab bar showing"
steps = [
  { eval = "byText('.library-card .btn', 'Open')?.click()" },
  # A 1 MB PDF rendering in a debug build takes a while to paint the first page.
  { wait = 14000 },
]

[[shot]]
id = "pdf-annotations"
file = "pdf-annotations.png"
description = "Annotation panel beside a page with existing highlights"
steps = [
  { eval = "byText('.library-card .btn', 'Open')?.click()" },
  # A 1 MB PDF rendering in a debug build takes a while to paint the first page.
  { wait = 14000 },
  { eval = "byText('.pdf-toolbar button', 'Notes')?.click()" },
  { wait = 1200 },
]

[[shot]]
id = "graph-citations"
file = "graph-citations.png"
description = "Citation graph in Citations edge mode"
steps = [
  { eval = "byText('button', 'Graph')?.click()" },
  { wait = 3000 },
  # The view opens on Tags; this shot is named for the Citations mode, which
  # is the one showing directed citing → cited edges.
  { eval = "byText('.graph-mode-btn, button', 'Citations')?.click()" },
  { wait = 2500 },
]

[[shot]]
id = "settings-general"
file = "settings-general.png"
description = "Settings dialog on the General tab"
steps = [
  { click = ".sidebar-settings-btn" },
  { wait = 900 },
]

[[shot]]
id = "settings-keybindings"
file = "settings-keybindings.png"
description = "The keybindings table with editable shortcut chips"
steps = [
  { click = ".sidebar-settings-btn" },
  { wait = 700 },
  { eval = "byText('.settings-tab', 'Keybindings')?.click()" },
  { wait = 900 },
]

[[shot]]
id = "citation-dialog"
file = "citation-dialog.png"
description = "Generate Citation dialog with the style picker and preview"
steps = [
  # The Cite button stays disabled until a paper is selected, so this has to
  # match the selection that library-overview makes, not just any click.
  { eval = "realClick(document.querySelectorAll('.library-card')[2])" },
  { wait = 1200 },
  { eval = "byText('button', 'Cite')?.click()" },
  { wait = 1500 },
]
